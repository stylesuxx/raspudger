; BENCH-DUT: deliberately vulnerable UART target for the Raspudger rig.
; Open this test-dut/ folder in VS Code with the PlatformIO IDE extension, then
; use the PlatformIO Build and Upload buttons (or `pio run -t upload`).
;
; Board: ESP32-C3 (Waveshare ESP32-C3-Zero). The generic C3 DevKitM profile
; fits it (RISC-V, 4MB flash, native USB Serial/JTAG).

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Route Serial to the native USB CDC so the USB monitor works for local debug,
; while Serial1 (GPIO4/GPIO5) talks to the Pi. Matches the sketch.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; With more than one ESP32 attached, uncomment and set the DUT's port so Upload
; never targets another board by auto-detect.
; upload_port = /dev/ttyACM1
; monitor_port = /dev/ttyACM1
