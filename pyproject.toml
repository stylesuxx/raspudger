[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raspudger"
version = "0.1.0"
description = "Host wrapper and agent session launcher for the Raspudger hardware security rig"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp==2.3.0"]

[project.scripts]
rasp = "raspudger.cli:main"
rig-mcp-server = "rig_mcp.main:main"
rig-model-proxy = "rig_proxy.main:main"

[project.optional-dependencies]
dev = [
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pytest==8.3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["raspudger", "rig_mcp", "rig_proxy"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "auth"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
